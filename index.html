<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BoltVault</title>
<style>
  :root { --bg: #f2f2f7; --text: #000; --secondary: #3c3c43b3; --accent: #0a84ff; }
  @media (prefers-color-scheme: dark) { :root { --bg: #000; --text: #fff; --secondary: #ebebf5b3; } }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 17px/1.5 -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
  main { max-width: 680px; margin: 0 auto; padding: 64px 16px; }
  h1 { font-size: 34px; margin: 0 0 8px; }
  p { color: var(--secondary); margin: 0 0 16px; }
  a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <h1>BoltVault</h1>
  <p>A card collection app for iPhone. No accounts, no adverts, no tracking.</p>
  <p><a href="privacy/">Privacy Policy</a> · <a href="mailto:boltvault@icloud.com">Contact</a></p>
</main>
</body>
</html>
